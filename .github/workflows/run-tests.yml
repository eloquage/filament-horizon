name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        compatibility:
          - php: '8.2'
            laravel: '12.*'
            filament: '4.*'
            testbench: '10.*'
            carbon: '3.*'
          - php: '8.5'
            laravel: '12.*'
            filament: '4.*'
            testbench: '10.*'
            carbon: '3.*'
          - php: '8.2'
            laravel: '12.*'
            filament: '5.*'
            testbench: '10.*'
            carbon: '3.*'
          - php: '8.5'
            laravel: '12.*'
            filament: '5.*'
            testbench: '10.*'
            carbon: '3.*'
          - php: '8.3'
            laravel: '13.*'
            filament: '5.*'
            testbench: '11.*'
            carbon: '3.*'
          - php: '8.5'
            laravel: '13.*'
            filament: '5.*'
            testbench: '11.*'
            carbon: '3.*'

    name: P${{ matrix.compatibility.php }} - L${{ matrix.compatibility.laravel }} - F${{ matrix.compatibility.filament }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.compatibility.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.compatibility.laravel }}" "filament/filament:${{ matrix.compatibility.filament }}" "orchestra/testbench:${{ matrix.compatibility.testbench }}" "nesbot/carbon:${{ matrix.compatibility.carbon }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Audit dependencies
        run: composer audit --locked

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci
